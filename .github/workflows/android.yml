name: Android

on:
  push:
    branches: [feat/android-support]
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package*.json"
      - "src/lib/native-*.ts"
      - "src/lib/app-biometrics*"
      - "src/components/Native*"
      - "src/app/api/native/**"
      - "scripts/*android*.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Preserve published sales behavior
        run: npm run verify:sales-preservation
      - name: Check web and native integration
        run: npm run check
      - name: Sync Android production configuration
        run: npm run cap:sync:android
      - name: Compile Android and run lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease :app:testDebugUnitTest --no-daemon
      - name: Save installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: rf-tools-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android/app/build/reports/
          if-no-files-found: ignore
